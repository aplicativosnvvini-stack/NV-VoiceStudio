name: NV Voice Lite Android
on:
  workflow_dispatch:
  push:
    branches: ['nv/voice-lite']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96
      - name: Install SDK components
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > mobile/android/local.properties
          bash mobile/android/install-sdk-packages.sh
      - name: Compile Android test APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon :core:local:testDebugUnitTest --tests '*PhoneVoicesTest' :app:assembleDebug
      - name: Verify signed APK
        run: |
          mkdir -p "$RUNNER_TEMP/nv-apk"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/nv-apk/NV-Voice-Lite.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$RUNNER_TEMP/nv-apk/NV-Voice-Lite.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: NV-Voice-Lite-Android
          path: ${{ runner.temp }}/nv-apk/NV-Voice-Lite.apk
          if-no-files-found: error
          retention-days: 30
